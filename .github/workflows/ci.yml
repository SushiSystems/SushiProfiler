name: CI

# The pre-merge stage on every pull request; ThreadSanitizer joins it on every push to main.
# Every build and test job runs the project CLI; tests/README.md gives the sizes. release.yml
# calls it before it builds the documentation bundle.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checkers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python -m pip install -e ./cli
        run: python -m pip install -e ./cli
      - name: python tools/check_all.py .
        run: python tools/check_all.py .

  cli:
    name: Python CLI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python -m pip install -e ./cli[test]
        run: python -m pip install -e "./cli[test]"
      - name: python -m pytest tests -q
        working-directory: cli
        run: python -m pytest tests -q

  linux:
    name: Linux (small, medium, package)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sp
      - name: sp build --type release
        run: sushiprofiler build --type release
      - name: sp test --label small
        run: sushiprofiler test --label small
      - name: sp test --label medium --package
        run: sushiprofiler test --label medium --package

  windows:
    name: Windows (small, medium, package)
    timeout-minutes: 45
    runs-on: windows-latest
    env:
      SP_CXX: cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sp
      - uses: ilammy/msvc-dev-cmd@v1
      - name: sp build --type release
        run: sushiprofiler build --type release
      - name: sp test --label small
        run: sushiprofiler test --label small
      - name: sp test --label medium --package
        run: sushiprofiler test --label medium --package

  sanitizers:
    name: ASan and UBSan (small, medium)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sp
      - name: sp build --sanitize address
        run: sushiprofiler build --sanitize address
      - name: sp test --sanitize address --label small --label medium
        run: sushiprofiler test --sanitize address --label small --label medium

  thread-sanitizer:
    name: ThreadSanitizer (small, medium)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sp
      - name: sp build --sanitize thread --type relwithdebinfo
        run: sushiprofiler build --sanitize thread --type relwithdebinfo
      - name: sp test --sanitize thread --label small --label medium
        run: sushiprofiler test --sanitize thread --label small --label medium

  gate:
    name: gate
    if: always()
    needs: [checks, cli, linux, windows, sanitizers, thread-sanitizer]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
