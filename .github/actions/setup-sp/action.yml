name: Set up sp
description: Installs Python, the sp CLI from cli/ and Ninja.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: python -m pip install -e ./cli
      shell: bash
      run: python -m pip install -e ./cli
    - name: sudo apt-get install -y ninja-build clang
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang
    - name: choco install ninja
      if: runner.os == 'Windows'
      shell: bash
      run: choco install ninja -y --no-progress
