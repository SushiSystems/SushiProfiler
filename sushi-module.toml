# What this module is. `hub` reads this when the checkout is in a workspace; when it is
# absent, `hub` falls back to its own catalog entry for a module it already knows.
# The format: docs/reference/MODULE_MANIFEST.md in the SushiStack repository.
#
# `fragment` is omitted: the default cli/sushistack.deps.toml holds no dependency, only
# `[module] cli = "sp"`, the CLI a consumer's package build runs.

[module]
name = "sushiprofiler"
alias = "sp"
distribution = "source"
repo = "https://github.com/sushisystems/sushiprofiler.git"
